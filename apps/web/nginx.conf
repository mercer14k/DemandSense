limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://api:8027;
    proxy_set_header Host api;
    proxy_read_timeout 120s;
  }
  location = /health { proxy_pass http://api:8027/health; proxy_set_header Host api; }
  location = /ready { proxy_pass http://api:8027/ready; proxy_set_header Host api; }
  location / { try_files $uri $uri/ /index.html; }
}
